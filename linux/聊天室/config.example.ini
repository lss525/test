# 聊天室服务端配置文件示例
# 使用方法：复制本文件为 config.ini，然后填入你自己的真实值。
#   cp config.example.ini config.ini
# config.ini 已被 .gitignore 忽略，不会被上传到 git。

# ===== MySQL 数据库 =====
mysql.host = 127.0.0.1
mysql.port = 3306
mysql.user = chat
mysql.password = 在这里填你的数据库密码
mysql.database = chat_system

# ===== Redis =====
redis.host = 127.0.0.1
redis.port = 6379
redis.password =
redis.db = 0

# ===== 邮箱（用于发送验证码，QQ 邮箱 SMTP 授权码）=====
smtp.user = 你的邮箱@qq.com
smtp.password = 在这里填你的SMTP授权码
